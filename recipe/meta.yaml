{% set name = "better_exceptions_fork" %}
{% set version = "0.2.1.post6" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5f0983da51e956dbdaf8b9a3d10e2774b382ce6c6ff2e54685c33e2dbe8f1472

build:
  number: 1
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - ansimarkup >=1.3.0
    - pygments >=2.2.0
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - better_exceptions
    - better_exceptions_fork

about:
  home: https://github.com/delgan/better-exceptions
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Pretty and helpful exceptions, automatically

extra:
  recipe-maintainers:
    - mariusvniekerk
